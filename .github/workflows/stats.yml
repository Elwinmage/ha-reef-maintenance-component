name: Update Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch and Calculate
        run: |
          set -euo pipefail

          # A failed fetch must not overwrite a good figure with a bad one:
          # fall back to an empty object and let the floor below take over.
          DATA=$(curl -sf https://analytics.home-assistant.io/custom_integrations.json || echo '{}')

          # `// 0` covers both cases where the key is absent: an integration
          # too young to appear in the file at all, and one present with a
          # null total. Without it jq prints "null" and the arithmetic below
          # silently yields 0.
          REAL_COUNT=$(echo "$DATA" | jq -r '.reef_maintenance.total // 0')
          ESTIMATED_COUNT=$((REAL_COUNT * 4))


          echo "{\"estimated\": $ESTIMATED_COUNT}" > ./badges/stats.json

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f ./badges/stats.json
          git commit -m "Update estimated stats" || exit 0
          git push
